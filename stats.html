<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>みんなの結果</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;700;800&family=Noto+Sans+JP:wght@400;500&family=Poppins:wght@600&display=swap">
<style>

/* 色・書体・角丸は、ライフテックコーディネーターのデザインルールに沿う。
   ダークモードの色は、地と文字を反転させて派生させた。
   レイアウト：1列の読み物。問いは1問ずつ、結果は「点数 → 2本の棒 → 今日の1つ → カード9枚」の順。 */
:root{
  --bg:#FBF7F1; --ink:#3D3A36; --card:#FFFFFF; --line:#EAE3D8; --muted:#736B61;
  --primary:#DC7C5C; --primary-hover:#cf6e4d; --secondary:#8FAE97; --sage-deep:#5F8069; --accent:#E8B05C;
  --terra-tint:#FBEEE8; --sage-tint:#E9F0EB; --honey-tint:#FBF0DB;
  --on-primary:#FFFFFF;
  --r-sm:11px; --r-card:16px; --r-recipe:22px; --r-cta:28px; --r-pill:999px;
  --shadow-card:0 14px 28px -18px rgba(61,58,54,.28);
  --ja-h:"M PLUS 1p",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  --ja-b:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  --en-h:"Poppins",system-ui,sans-serif;
  --t:.22s;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#211F1D; --ink:#EDE7DE; --card:#2A2724; --line:#3B3733; --muted:#ABA298;
    --primary:#E68E6E; --primary-hover:#EFA084; --secondary:#9DBCA5; --sage-deep:#9DBCA5; --accent:#EFBE72;
    --terra-tint:#3A2A24; --sage-tint:#26302A; --honey-tint:#38301F;
    --on-primary:#211F1D;
    --shadow-card:0 14px 28px -20px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#211F1D; --ink:#EDE7DE; --card:#2A2724; --line:#3B3733; --muted:#ABA298;
  --primary:#E68E6E; --primary-hover:#EFA084; --secondary:#9DBCA5; --sage-deep:#9DBCA5; --accent:#EFBE72;
  --terra-tint:#3A2A24; --sage-tint:#26302A; --honey-tint:#38301F;
  --on-primary:#211F1D;
  --shadow-card:0 14px 28px -20px rgba(0,0,0,.55);
  color-scheme:dark;
}


/* 集計ページ：問いごとに、選択肢の割合を横棒で見せる（1色＝量。参考の調査は墨の破線） */
:root{--bar:#cf6e4d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#E68E6E}}
:root[data-theme="dark"]{--bar:#E68E6E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ja-b);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--ja-h);margin:0;line-height:1.4}
p{margin:0}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px;display:flex;flex-direction:column;gap:28px}
.head{display:flex;flex-direction:column;gap:8px}
.head h1{font-weight:800;font-size:clamp(26px,4.4vw,34px)}
.note{color:var(--muted);font-size:13.5px}
.banner{background:var(--honey-tint);border-radius:var(--r-card);padding:10px 16px;font-size:14px;font-weight:500}
.tiles{display:flex;flex-wrap:wrap;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 18px;min-width:150px}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-family:var(--en-h);font-weight:600;font-size:30px;font-variant-numeric:tabular-nums}
.filter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.filter select{font:inherit;padding:6px 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);color:var(--ink)}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q .axis{font-size:12px;color:var(--muted)}
.q h2{font-size:16px;font-weight:700}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,38%) 5.5em;gap:10px;align-items:center;font-size:13.5px}
.row .lab{min-width:0}
.track{position:relative;height:14px;background:var(--line);border-radius:0 4px 4px 0}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:0 4px 4px 0}
.ref{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--ink)}
.val{font-family:var(--en-h);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.val small{display:block;font-family:var(--ja-b);font-weight:400;font-size:11.5px;color:var(--muted)}
table.days{border-collapse:collapse;font-size:13.5px;min-width:320px}
table.days th,table.days td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:right}
table.days th:first-child,table.days td:first-child{text-align:left}
table.days .num{font-family:var(--en-h);font-variant-numeric:tabular-nums}
.refnote{font-size:12.5px;color:var(--muted)}
.refnote b{color:var(--ink);font-weight:500}
.few{font-size:13px;color:var(--muted)}
@media (max-width:560px){.row{grid-template-columns:1fr 4.8em} .row .track{grid-column:1 / -1;order:3}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>みんなの結果</h1>
    <p class="note">2分セキュリティ診断の集計です。1件ずつの答えではなく、選択肢ごとの人数だけを出しています。割合は、答えた人のうちの割合です（世の中全体の割合ではありません）。</p>
    <div id="banner"></div>
  </header>
  <section class="tiles" id="tiles"></section>
  <div class="filter"><label for="age">年代でしぼる</label><select id="age"></select><span class="few" id="few"></span></div>
  <main id="qs" style="display:flex;flex-direction:column;gap:14px"></main>
</div>
<script>
const API = "https://security-checkup.miki-protection.workers.dev";
const Q = [
  {id:1, axis:"a", title:"パスワードの種類について、いちばん近いものはどれですか",
   opts:[["基本的に、サービスごとにちがうパスワードにしている",2],["大事なサービスだけ、ちがうパスワードにしている",1],["同じパスワードを、いくつものサービスで使っている",0]]},
  {id:2, axis:"a", title:"パスワードは、何で管理していますか", sub:"いちばん近いものを1つ選んでください",
   opts:[["パスワード管理アプリや、iPhone・パソコン・ブラウザのパスワード機能",2],["パソコンやスマホのメモ帳・表計算など（専用ではないアプリ）",1],["紙の手帳やノート",1],["頭で覚えている",1]]},
  {id:3, axis:"a", title:"ふだんいちばん使っているメールアドレスに、パスワードのほかに、もう1つの確認を設定していますか",
   examples:["パスキー（顔や指紋などで使う）","認証アプリに出る数字","SMSやメールで届く数字"],
   help:"「いちばん使っている」は、やりとりでも登録でも、多く使っているほうで。パスキーは、端末の中の暗号の鍵を使うログインで、顔や指紋、端末のPINなどで使います。認証アプリはGoogle Authenticatorなどです。",
   opts:[["設定している",2],["わからない",1],["設定していない（パスワードだけ）",0]]},
  {id:4, axis:"a", title:"「パスキー」を知っていますか",
   opts:[["知っていて、使っている",2],["知っているが、使っていない",1],["知らない",0]]},
  {id:5, axis:"a", title:"「アカウントが止まります」というメールやSMSが届いたら、どうしますか",
   help:"「お支払い情報を確認してください」なども同じです。自分でログインしようとして届いたメールは含みません。",
   opts:[["リンクは押さず、公式アプリやブックマークから自分で確かめる",2],["差出人やURLを見て、本物らしければリンクから入る",1],["そのままリンクから入る",0]]},
  {id:6, axis:"b", title:"サービスに登録するとき、メールアドレスはいくつ使い分けていますか",
   help:"「メールを非公開」やエイリアスなど、自動で作るアドレスも数に入れます。",
   opts:[["ほぼサービスごとに、別々のアドレスを使っている",2],["いくつかのアドレスを使い分けている（ふだん用と登録用、など）",1],["ほとんど1つのアドレスで登録している",0]]},
  {id:7, axis:"b", title:"「Googleでログイン」のように、ほかのサービスのアカウントで登録やログインをしますか",
   help:"新しいIDやパスワードを作らずに、GoogleやApple、LINEなどのアカウントで入る方法です。",
   opts:[["ほとんど使わない",2],["使う。そのアカウントにも「もう1つの確認」を設定している",2],["使う。そのアカウントはパスワードだけ／わからない",0]]},
  {id:8, axis:"b", title:"パスワードが漏れていないか、確かめたことはありますか",
   help:"パスワード管理アプリやiPhoneの「パスワード」アプリの警告、漏洩を調べるサイトなどで確かめられます。",
   opts:[["定期的に確かめている",2],["確かめたことはある",1],["ない",0]]},
  {id:9, axis:"b", title:"クレジットカードが勝手に使われたら、すぐ気づけますか",
   help:"カード会社のアプリやメールの利用通知などです。",
   opts:[["利用通知を受け取っている",2],["明細はときどき見ている",1],["ほとんど見ていない",0]]},
];
const AGE = ["10代","20代","30代","40代","50代","60代","70代以上","答えない"];
const AXES = {a:"戸締まり", b:"もしもの備え"};
// 参考：トレンドマイクロ「パスワード・パスキーの利用実態調査2026」（聞き方が違うので、並べて見るための目安）
const REF = {
  1: {opt:-1, pct:84.3, label:"参考：複数のサービスでパスワードを使い回している 84.3%（トレンドマイクロ2026・聞き方が違うので、どの選択肢にも重ねない）"},
  2: {opt:-1, pct:10.8, label:"参考：専用のパスワード管理アプリ 10.8%、ブラウザの保存機能 26.1%、記憶 40.9%（トレンドマイクロ2026・複数回答なので、どの選択肢にも重ねない）"},
  4: {opt:2, pct:8.9,  label:"参考：パスキーを知らない 8.9%（トレンドマイクロ2026の認知91.1%から）"},
};
const MIN_SHOW = 5; // 年代でしぼったとき、これより少ない人数なら数字を出さない
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (n, d) => d ? Math.round(n / d * 1000) / 10 : 0;

function points(qi, oi){ return Q[qi].opts[oi][1]; }

function render(data){
  const sel = document.getElementById("age");
  const a = sel.value === "" ? null : Number(sel.value);
  const qs = a === null ? data.questions : data.byAge[a];
  const n = a === null ? data.total : data.ages[a];
  // 概要：人数・平均点・年代
  let sum = 0;
  qs.forEach((opts, qi) => opts.forEach((c, oi) => sum += c * points(qi, oi)));
  const avg = n ? Math.round(sum / n * 10) / 10 : 0;
  // 開いた → 答え始めた → 最後まで答えた（年代でしぼっていないときだけ。日付ごとの回数の合計）
  const D = data.days || {};
  const tally = k => Object.values(D).reduce((s, d) => s + (d[k] || 0), 0);
  const fv = tally("view"), fs = tally("start"), fd = tally("done");
  const rate = (a, b) => b ? Math.round(a / b * 100) + "%" : "–";
  const funnel = a === null ?
    `<div class="tile"><div class="k">開いた</div><div class="v">${fv}</div></div>` +
    `<div class="tile"><div class="k">答え始めた（開いた人の${rate(fs, fv)}）</div><div class="v">${fs}</div></div>` +
    `<div class="tile"><div class="k">最後まで答えた（答え始めた人の${rate(fd, fs)}）</div><div class="v">${fd}</div></div>` : "";
  document.getElementById("tiles").innerHTML = funnel +
    (a === null ? "" : `<div class="tile"><div class="k">答えた人</div><div class="v">${n}</div></div>`) +
    `<div class="tile"><div class="k">平均点（18点満点）</div><div class="v">${n ? avg : "–"}</div></div>`;
  const few = a !== null && n < MIN_SHOW;
  document.getElementById("few").textContent = few ? `この年代はまだ${MIN_SHOW}人未満なので、数字は出していません` : "";
  const main = document.getElementById("qs");
  main.innerHTML = "";
  // 日付ごとの回数（新しい順に14日）
  if (a === null && Object.keys(D).length) {
    const rows = Object.keys(D).sort().reverse().slice(0, 14).map(d => `<tr><td>${d}</td><td class="num">${D[d].view||0}</td><td class="num">${D[d].start||0}</td><td class="num">${D[d].done||0}</td></tr>`).join("");
    const el = document.createElement("section");
    el.className = "q";
    el.innerHTML = `<h2>日付ごと</h2><div style="overflow-x:auto"><table class="days"><thead><tr><th>日付</th><th>開いた</th><th>答え始めた</th><th>最後まで</th></tr></thead><tbody>${rows}</tbody></table></div><p class="refnote">「開いた」は、ページを開いた回数です（同じ人が何度か開くと、その分数えます）。2026-10-20 から数え始めました。</p>`;
    main.appendChild(el);
  }
  // 年代の内訳（しぼっていないときだけ）
  if (a === null) main.appendChild(block("年代", "", AGE.map((label, i) => [label, data.ages[i]]), data.total, null));
  if (few) return;
  Q.forEach((q, qi) => {
    const rows = q.opts.map(([label], oi) => [label, qs[qi][oi]]);
    main.appendChild(block(`Q${q.id}. ${q.title}`, AXES[q.axis], rows, n, REF[q.id] || null));
  });
}

function block(title, axis, rows, n, ref){
  const el = document.createElement("section");
  el.className = "q";
  el.innerHTML = (axis ? `<span class="axis">${esc(axis)}</span>` : "") + `<h2>${esc(title)}</h2>` +
    rows.map(([label, c], oi) => {
      const p = pct(c, n);
      const r = ref && ref.opt === oi ? `<span class="ref" style="left:${ref.pct}%" aria-hidden="true"></span>` : "";
      return `<div class="row" title="${esc(label)}：${c}人（${p}%）"><span class="lab">${esc(label)}</span>` +
        `<span class="track"><span class="fill" style="width:${p}%"></span>${r}</span>` +
        `<span class="val">${p}%<small>${c}人</small></span></div>`;
    }).join("") +
    (ref ? `<p class="refnote">${ref.opt >= 0 ? "破線：" : ""}<b>${esc(ref.label)}</b></p>` : "");
  return el;
}

async function load(){
  const sel = document.getElementById("age");
  sel.innerHTML = `<option value="">すべて</option>` + AGE.map((l, i) => `<option value="${i}">${esc(l)}</option>`).join("");
  let data = window.STATS_DATA || null;
  if (!data) {
    try { data = await (await fetch(API + "/stats")).json(); }
    catch (e) { document.getElementById("banner").innerHTML = `<p class="banner">集計を読み込めませんでした。時間をおいて開き直してください。</p>`; return; }
  }
  if (window.STATS_SAMPLE) document.getElementById("banner").innerHTML = `<p class="banner">見本のデータで表示しています（本物の集計ではありません）</p>`;
  sel.onchange = () => render(data);
  render(data);
}
load();
</script>
</body>
</html>
